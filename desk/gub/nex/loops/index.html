<!doctype html>
<html>
<head>
  <title>loops</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/grubbery/loops/style.css">
</head>
<body>
  <div id="app">
    <div id="header">
      <div>
        <h1>loops</h1>
        <div class="sub">open commitments</div>
      </div>
      <div id="hdr-actions">
        <select id="ctx-select"></select>
        <button id="new-ctx" class="hdr-btn" title="New context">+ context</button>
        <button id="new-loop" class="hdr-btn">+ loop</button>
      </div>
      <div id="loader"><div class="spin"></div></div>
    </div>
    <div id="list"></div>
    <div id="closed-wrap">
      <button id="closed-toggle" class="hdr-btn">show closed</button>
      <div id="closed-list" style="display:none"></div>
    </div>
  </div>

  <div id="modal-back">
    <div id="modal">
      <h2>new loop</h2>
      <textarea id="m-text" rows="3" placeholder="what's dangling?"></textarea>
      <input id="m-labels" type="text" placeholder="labels, comma-separated (energy:low, domain:urbit, ...)">
      <label class="m-label">best by <input id="m-date" type="date"></label>
      <div id="m-actions">
        <button id="m-cancel" class="hdr-btn">cancel</button>
        <button id="m-save" class="hdr-btn primary">open loop</button>
      </div>
    </div>
  </div>
  <script src="/grubbery/loops/app.js"></script>
</body>
</html>
