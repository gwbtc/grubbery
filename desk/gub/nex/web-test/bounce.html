<!DOCTYPE html>
<html>
<head>
  <title>Bounce</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/grubbery/web-test/bounce.css">
</head>
<body>
  <canvas id="canvas"></canvas>
  <div class="title">
    <h1>grubbery / web-test</h1>
    <p>html + css + js + svg served from the namespace</p>
  </div>
  <div class="stats" id="stats"></div>
  <div class="hint">click to spawn more</div>
  <div class="badge">
    <span>html</span>
    <span>css</span>
    <span>js</span>
    <span>svg</span>
  </div>
  <div class="icon-demo">
    <p class="icon-label">feather icons via /code/lib/icons/*.svg</p>
    <div class="icon-row">
      <img src="/grubbery/api/file/code/lib/icons/zap.svg" alt="zap">
      <img src="/grubbery/api/file/code/lib/icons/star.svg" alt="star">
      <img src="/grubbery/api/file/code/lib/icons/heart.svg" alt="heart">
      <img src="/grubbery/api/file/code/lib/icons/feather.svg" alt="feather">
      <img src="/grubbery/api/file/code/lib/icons/globe.svg" alt="globe">
      <img src="/grubbery/api/file/code/lib/icons/send.svg" alt="send">
    </div>
  </div>
  <script src="/grubbery/web-test/bounce.js"></script>
</body>
</html>
