<!doctype html>
<html>
<head>
  <title>desks</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/svg+xml" href="/grubbery/desks/icon.svg">
  <link rel="stylesheet" href="/grubbery/desks/style.css">
</head>
<body>
  <div id="app">
    <div id="header">
      <div>
        <h1>desks</h1>
        <div class="sub">git &amp; cross-ship desks</div>
      </div>
      <div id="hdr-actions">
        <button id="new-desk" class="hdr-btn primary">+ desk</button>
      </div>
      <div id="loader"><div class="spin"></div></div>
    </div>
    <div id="entries"></div>
  </div>

  <div id="modal-back">
    <div id="modal">
      <h2 id="modal-title">new desk</h2>
      <div id="src-seg">
        <button id="src-git" class="seg active">git</button>
        <button id="src-ship" class="seg">cross-ship</button>
      </div>
      <label class="m-label">name <input id="m-name" type="text" placeholder="short id, e.g. contacts"></label>
      <div id="git-fields">
        <label class="m-label">repo <input id="m-repo" type="text" placeholder="owner/repo"></label>
        <label class="m-label">ref <input id="m-ref" type="text" placeholder="main" value="main"></label>
        <label class="m-label">poll (min, 0 = off) <input id="m-poll" type="text" placeholder="0"></label>
        <label class="m-label">GitHub token <span class="hint">(only needed to push)</span> <input id="m-token" type="text" placeholder=""></label>
      </div>
      <div id="ship-fields" style="display:none">
        <label class="m-label">source <input id="m-source" type="text" placeholder="~nec/apps/foo or /local/path"></label>
      </div>
      <label class="m-check"><input id="m-public" type="checkbox"> public — others may follow this desk</label>
      <div id="m-actions">
        <button id="m-cancel" class="hdr-btn">cancel</button>
        <button id="m-save" class="hdr-btn primary">create</button>
      </div>
    </div>
  </div>
  <div id="detail-back">
    <div class="pmodal">
      <div class="detail-head">
        <h2 id="detail-name"></h2>
        <button id="detail-close" class="hdr-btn">close</button>
      </div>
      <div id="detail-meta"></div>
      <div id="detail-actions" class="entry-actions"></div>
      <div class="detail-section">
        <div class="detail-h">code checkpoints</div>
        <div id="detail-code" class="ckpts"></div>
      </div>
      <div class="detail-section">
        <div class="detail-h">data checkpoints</div>
        <div id="detail-data" class="ckpts"></div>
      </div>
    </div>
  </div>

  <div id="push-back">
    <div class="pmodal">
      <h2>push <span id="push-name"></span></h2>
      <p class="push-note">Builds a commit from this desk's current code and assets (code, bill, tile, icon, version) and pushes it to branch <b id="push-branch-label"></b> on GitHub.</p>
      <label class="m-label">commit message <input id="push-message" type="text" value="update from ship"></label>
      <div id="push-status"></div>
      <div id="m-actions">
        <button id="push-cancel" class="hdr-btn">cancel</button>
        <button id="push-go" class="hdr-btn primary">commit &amp; push</button>
      </div>
    </div>
  </div>
  <script src="/grubbery/desks/app.js"></script>
</body>
</html>
