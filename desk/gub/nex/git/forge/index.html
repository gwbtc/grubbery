<!doctype html>
<html>
<head>
  <title>forge</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/svg+xml" href="/grubbery/forge/icon.svg">
  <link rel="stylesheet" href="/grubbery/forge/style.css">
</head>
<body>
  <div id="ide">
    <div id="topbar">
      <button id="sb-toggle" class="icon-btn" title="toggle sidebar">☰</button>
      <a id="brand" href="/grubbery/forge">forge</a>
      <span id="tb-switch" style="position:relative">
        <button id="tb-repo" style="display:none"></button>
        <div id="repo-menu"></div>
      </span>
      <span id="tb-branch-wrap" style="position:relative">
        <button id="tb-branch" class="chip" style="display:none"></button>
        <div id="branch-menu"></div>
      </span>
      <div id="mode-tabs" style="display:none">
        <button class="mode-tab" data-mode="files">repo</button>
        <button class="mode-tab" data-mode="tools">tools</button>
        <button class="mode-tab" data-mode="settings">settings</button>
      </div>
      <span id="tb-origin"></span>
      <div id="tb-actions"></div>
    </div>
    <div id="body">
      <div id="sidebar">
        <div class="sb-head" id="sb-head"></div>
        <div id="sb-list"></div>
        <div id="ft-new" style="display:none">
          <input id="ft-new-name" type="text" placeholder="lib/tools/new-tool.hoon">
          <button class="hdr-btn" id="ft-create">new</button>
        </div>
      </div>
      <div id="workspace">
        <div id="ed-bar" style="display:none">
          <div id="ed-tabs"></div>
          <button class="hdr-btn primary" id="ed-save" style="display:none">save ⌘S</button>
        </div>
        <div id="runner-pane" style="display:none">
          <div id="tool-subtabs">
            <button class="tool-subtab active" data-sub="run">run</button>
            <button class="tool-subtab" data-sub="permissions">permissions</button>
          </div>
          <div id="tool-sub-run">
            <div class="run-cols">
              <div class="run-col"><div class="run-head">tools</div><div id="run-tools"></div></div>
              <div class="run-col"><div class="run-head">procs</div><div id="run-procs"></div></div>
            </div>
          </div>
          <div id="tool-sub-permissions" style="display:none"></div>
        </div>
        <div id="ed-wrap" style="display:none">
          <div id="ws-empty">open a file from the tree</div>
          <div id="ed-body" style="display:none">
            <div id="ed-hl"></div>
            <textarea id="ed-ta" spellcheck="false"></textarea>
          </div>
          <pre id="ed-tang" style="display:none"></pre>
        </div>
        <div id="settings-pane" style="display:none"></div>
        <div id="landing" style="display:none">
          <div id="landing-head">
            <div class="run-head">repos <span id="landing-count"></span></div>
            <button id="new-repo" class="hdr-btn primary">+ repo</button>
          </div>
          <div id="landing-grid"></div>
        </div>
      </div>
    </div>
    <div id="console">
      <div id="con-bar">
        <button class="con-tab active" data-panel="status">status</button>
        <button class="con-tab" data-panel="history">history</button>
        <span id="con-spacer"></span>
        <button id="con-toggle" class="icon-btn" title="toggle panel">▾</button>
      </div>
      <div id="con-body">
        <div id="pane-status" class="con-pane"></div>
        <div id="pane-history" class="con-pane" style="display:none"></div>
      </div>
    </div>
  </div>

  <div id="modal-back">
    <div id="modal">
      <h2>new repo</h2>
      <label class="m-label">name <input id="m-name" type="text" placeholder="short id, e.g. contacts"></label>
      <label class="m-label">repo <input id="m-repo" type="text" placeholder="owner/repo (blank for empty)"></label>
      <label class="m-label">ref <input id="m-ref" type="text" placeholder="main" value="main"></label>
      <label class="m-label">token <span class="hint">(only needed to push)</span> <input id="m-token" type="text"></label>
      <div id="m-actions">
        <button id="m-cancel" class="hdr-btn">cancel</button>
        <button id="m-save" class="hdr-btn primary">create</button>
      </div>
    </div>
  </div>
  <div id="json-back">
    <div id="json-modal">
      <div id="json-head"><span id="json-title"></span><button class="hdr-btn" id="json-close">close</button></div>
      <pre id="json-pre"></pre>
    </div>
  </div>
  <script src="/grubbery/forge/app.js"></script>
</body>
</html>
