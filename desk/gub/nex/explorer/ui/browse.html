<!doctype html>
<!--
  explorer browse page — one full-size <namespace-explorer> (browse.js), the
  explorer as a web component. Served for every dir URL a browser
  asks for (?list / ?download bypass), and by apps that mount the explorer at
  their own route (they inject window.EXPLORER_MOUNT ahead of the scripts).
  All state is fetched from <dir>?list=1 and rendered by the explorer; kit
  components do the widgets. The file page is view.html, on the same pattern.
-->
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>explorer</title>
  <link rel="icon" type="image/svg+xml" href="/grubbery/tiles/icon/explorer.explorer">
  <style>
    * { box-sizing: border-box; }
    body { font: 13px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #1f2328; background: #fff; margin: 0; padding-bottom: 48px; }
    a { color: #0969da; text-decoration: none; }
    a:hover { text-decoration: underline; }
    /* the finder view is a fixed page: the explorer fills the window exactly
       and only its panes scroll (the list view keeps the page-scroll and
       its bottom padding). The explorer marks <body> cols itself (page: true). */
    body.cols { height: 100vh; overflow: hidden; padding-bottom: 0; }
    body.cols > namespace-explorer { height: 100%; }
  </style>
</head>
<body>
  <namespace-explorer id="explorer"></namespace-explorer>

  <!-- one request for every component + the file viewer (welded in
       explorer.hoon's on-load), classic so it runs before browse.js, which
       is a module and therefore deferred -->
  <script src="/grubbery/ball/apps/explorer.explorer/kit.js"></script>
  <script type="module" src="/grubbery/ball/apps/explorer.explorer/browse.js"></script>
  <script type="module">
    // the explorer is the page here: it owns the url, the title and the favicon
    document.getElementById('explorer').mount({
      url: location.pathname,
      scope: new URLSearchParams(location.search).get('scope') || '',
      mount: window.EXPLORER_MOUNT || null,
      page: true,
    });
  </script>
</body>
</html>
