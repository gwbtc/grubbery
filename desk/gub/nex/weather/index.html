<!doctype html>
<html>
<head>
  <title>Weather</title>
  <link rel="icon" type="image/svg+xml" href="/grubbery/tiles/icon/weather.weather">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.css" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body { font-family: Inter, sans-serif; background: #f4f6f9; color: #111; }

    #shell { display: flex; flex-direction: column; height: 100%; }
    #topbar { display: flex; align-items: center; gap: 10px; padding: 10px 16px; background: white; border-bottom: 1px solid #e3e7ec; }
    #brand { font-size: 15px; font-weight: 700; margin-right: 8px; }
    #modes { display: flex; gap: 2px; background: #eef1f5; border-radius: 8px; padding: 2px; }
    .mode { font-size: 13px; padding: 5px 14px; border: none; background: none; border-radius: 6px; cursor: pointer; color: #667; font-family: inherit; }
    .mode.active { background: white; color: #111; font-weight: 600; box-shadow: 0 1px 2px rgba(0,0,0,0.08); }
    #topbar .flex { flex: 1; }
    #stamp { font-size: 11px; color: #99a; }
    .btn { font-size: 13px; padding: 6px 12px; border-radius: 8px; border: 1px solid #ddd; background: white; color: #555; cursor: pointer; font-family: inherit; }
    .btn:hover { background: #f5f5f5; }
    .btn.primary { background: #4a90d9; color: white; border-color: #4a90d9; }

    #body { flex: 1; display: flex; min-height: 0; }
    #side { width: 250px; flex-shrink: 0; background: white; border-right: 1px solid #e3e7ec; display: flex; flex-direction: column; min-height: 0; }
    #loc-list { flex: 1; overflow-y: auto; padding: 8px; }
    .l-row { display: grid; grid-template-columns: 30px 1fr auto auto; gap: 8px; align-items: center; padding: 8px 10px; border-radius: 10px; cursor: pointer; position: relative; }
    .l-row:hover { background: #f0f3f7; }
    .l-row.sel { background: #e4edf8; }
    .l-icon { width: 30px; height: 30px; }
    .l-name { font-size: 13px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .l-word { font-size: 11px; color: #778; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .l-temp { font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums; }
    .l-acts { display: flex; }
    .l-del, .l-move { border: none; background: none; color: #aab; font-size: 14px; cursor: pointer; border-radius: 6px; padding: 2px 6px; visibility: hidden; }
    .l-row:hover .l-del, .l-row:hover .l-move, .l-row.moving .l-move { visibility: visible; }
    .l-del:hover, .l-move:hover { background: #dde3ea; color: #556; }
    .l-row.moving { opacity: 0.5; }
    .l-row.moving .l-move { color: #4a90d9; }
    .l-slot { height: 9px; margin: 1px 8px; border-radius: 4px; background: #2e5f94; cursor: pointer; transition: background 0.12s; }
    .l-slot:hover { background: #7db8ef; }
    #add-row { display: flex; gap: 6px; padding: 10px; border-top: 1px solid #eef1f5; }
    #add-name { flex: 1; min-width: 0; font-size: 13px; padding: 8px 10px; border: 1px solid #ddd; border-radius: 8px; font-family: inherit; outline: none; }
    #add-name:focus { border-color: #4a90d9; box-shadow: 0 0 0 3px rgba(74,144,217,0.15); }

    #main { flex: 1; position: relative; min-width: 0; }
    #pane-forecast { position: absolute; inset: 0; overflow-y: auto; padding: 20px; }
    #doc { max-width: 720px; margin: 0 auto; }
    #pane-map { position: absolute; inset: 0; display: none; }
    #map { position: absolute; inset: 0; }
    #radar-bar { position: absolute; left: 12px; bottom: 12px; z-index: 5; display: flex; gap: 6px; align-items: center; background: rgba(255,255,255,0.92); border-radius: 8px; padding: 6px 10px; font-size: 12px; }
    .t-chip { background: #3d3a45; color: white; font-size: 12px; font-weight: 700; padding: 4px 8px; border-radius: 12px; border: 2px solid white; box-shadow: 0 1px 4px rgba(0,0,0,0.3); cursor: pointer; white-space: nowrap; }

    .doc-card { margin-bottom: 18px; scroll-margin-top: 8px; }
    .card { border-radius: 18px; padding: 20px 22px; color: white; position: relative; overflow: hidden; }
    .c-top { display: flex; align-items: center; gap: 4px; }
    .c-left { flex: 1; min-width: 0; }
    .c-name { font-size: 14px; font-weight: 600; opacity: 0.92; }
    .c-temp { font-size: 46px; font-weight: 700; line-height: 1.05; }
    .c-word { font-size: 14px; opacity: 0.92; }
    .c-meta { font-size: 12px; opacity: 0.78; margin-top: 6px; line-height: 1.5; }
    .c-icon { width: 110px; height: 110px; flex-shrink: 0; margin: -10px -8px; }

    .hourly { margin-top: 14px; background: rgba(255,255,255,0.12); border-radius: 12px; padding: 10px 8px 4px; }
    .hourly svg { display: block; width: 100%; }

    .week { margin-top: 10px; }
    .w-row { display: grid; grid-template-columns: 44px 34px 40px 1fr 34px 34px; gap: 8px; align-items: center; padding: 5px 4px; font-size: 13px; }
    .w-day { opacity: 0.9; }
    .w-icon { width: 32px; height: 32px; }
    .w-pp { font-size: 11px; opacity: 0.75; text-align: right; }
    .w-lo { opacity: 0.65; text-align: right; font-variant-numeric: tabular-nums; }
    .w-hi { font-weight: 700; font-variant-numeric: tabular-nums; }
    .w-head { font-size: 10px; text-transform: uppercase; letter-spacing: 0.5px; opacity: 0.6; padding: 0 4px 2px; }
    .w-head .w-hi, .w-head .w-lo, .w-head .w-pp { font-size: 10px; font-weight: 600; opacity: 1; }
    .w-mid { text-align: center; }
    .w-bar-track { position: relative; height: 5px; border-radius: 3px; background: rgba(255,255,255,0.18); }
    .w-bar { position: absolute; top: 0; bottom: 0; border-radius: 3px; min-width: 6px; }
    .w-grid { position: absolute; top: -3px; bottom: -3px; width: 1px; background: rgba(255,255,255,0.25); }
    .w-axis { padding-top: 0; }
    .w-axis-track { position: relative; height: 14px; }
    .w-tick { position: absolute; top: 1px; transform: translateX(-50%); font-size: 9px; opacity: 0.65; font-variant-numeric: tabular-nums; }

    .empty { color: #999; font-size: 14px; padding: 60px 0; text-align: center; }

    @media (max-width: 640px) {
      #body { flex-direction: column; }
      #side { width: 100%; border-right: none; border-bottom: 1px solid #e3e7ec; max-height: 40%; }
      #brand { display: none; }
    }
  </style>
</head>
<body>
  <div id="shell">
    <div id="topbar">
      <span id="brand">weather</span>
      <div id="modes">
        <button class="mode active" data-mode="forecast">forecast</button>
        <button class="mode" data-mode="map">map</button>
      </div>
      <span class="flex"></span>
      <span id="stamp"></span>
      <button class="btn" id="unit-toggle">°C</button>
      <button class="btn" id="refresh">refresh</button>
    </div>
    <div id="body">
      <div id="side">
        <div id="loc-list"></div>
        <div id="add-row">
          <input id="add-name" type="text" placeholder="add a city">
          <button class="btn primary" id="add-btn">+</button>
        </div>
      </div>
      <div id="main">
        <div id="pane-forecast"><div id="doc"></div></div>
        <div id="pane-map">
          <div id="map"></div>
          <div id="radar-bar">
            <button class="btn" id="radar-play" style="padding:2px 10px">▶</button>
            <span id="radar-time">radar</span>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script src="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.js"></script>
  <script src="/grubbery/weather/app.js"></script>
</body>
</html>
