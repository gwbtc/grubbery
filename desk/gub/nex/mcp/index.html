<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tools</title>
<link rel="stylesheet" href="/grubbery/mcp/style.css">
</head>
<body>
<header>
  <h1>Tools</h1>
  <div class="head-right">
    <span id="counts"></span>
    <button id="refresh" title="Refresh">&#8635;</button>
  </div>
</header>
<main>
  <section id="main-pane">
    <div class="pane-tabs">
      <button id="tab-tools" class="pane-tab active">Available Tools</button>
      <button id="tab-runs" class="pane-tab">Runs</button>
      <button id="tab-reference" class="pane-tab">Reference</button>
    </div>
    <div id="tools-view">
      <div class="scroll">
        <div id="tools-tree"></div>
      </div>
    </div>
    <div id="reference-view" hidden>
      <div class="ref-layout">
        <nav id="ref-sidebar" class="ref-sidebar"></nav>
        <div id="ref-main" class="ref-main scroll"></div>
      </div>
    </div>
    <div id="runs-view" hidden>
      <div class="sb-toolbar">
        <span class="sb-hint">tools/runs — every tool call in flight. Finished runs are culled by their caller.</span>
      </div>
      <div class="scroll">
        <div id="runs-list"></div>
        <p id="runs-empty" class="empty" hidden>No runs in flight.</p>
      </div>
    </div>
  </section>
</main>
<div id="modal" class="modal" hidden>
  <div class="modal-box">
    <div class="modal-head">
      <span id="modal-title"></span>
      <button id="modal-close">&times;</button>
    </div>
    <div id="modal-body"></div>
  </div>
</div>
<script src="/grubbery/mcp/marked.min.js"></script>
<script src="/grubbery/mcp/app.js"></script>
</body>
</html>
