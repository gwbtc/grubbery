<!DOCTYPE html>
<html>
<head>
  <title>calendar</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/grubbery/calendar/calendar.css">
</head>
<body>
  <div id="app">
    <div id="header">
      <div id="nav">
        <button id="prev" class="nav-btn icon-btn" title="Previous">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
        </button>
        <button id="today" class="nav-btn">Today</button>
        <button id="next" class="nav-btn icon-btn" title="Next">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
        </button>
        <button id="axis-btn" class="nav-btn icon-btn" title="Set the axis date the view is oriented around">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3.5"/><line x1="12" y1="1.5" x2="12" y2="5"/><line x1="12" y1="19" x2="12" y2="22.5"/><line x1="1.5" y1="12" x2="5" y2="12"/><line x1="19" y1="12" x2="22.5" y2="12"/></svg>
        </button>
        <input id="axis-input" type="date" style="position:absolute;opacity:0;pointer-events:none;width:0;height:0;">
      </div>
      <span id="month-label"></span>
      <div id="loader"><div class="spin"></div></div>
      <select id="zone-sel" title="Display timezone"></select>
      <button id="globe-btn" class="nav-btn icon-btn" title="Set calendar timezone to your browser timezone">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18"/><path d="M12 3a15 15 0 0 1 0 18a15 15 0 0 1 0-18"/></svg>
      </button>
      <button id="sync-btn" class="nav-btn icon-btn" title="Sync external calendar feeds (Google Calendar etc.)">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><polyline points="21 3 21 9 15 9"/></svg>
      </button>
      <button id="feeds-btn" class="nav-btn icon-btn" title="Manage external calendar feeds">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 11a9 9 0 0 1 9 9"/><path d="M4 4a16 16 0 0 1 16 16"/><circle cx="5" cy="19" r="1.5" fill="currentColor" stroke="none"/></svg>
      </button>
      <button id="clock-btn" class="nav-btn" title="Clock format"></button>
      <div id="views">
        <button id="v-month" class="nav-btn view-btn">Month</button>
        <button id="v-week" class="nav-btn view-btn">Week</button>
        <button id="v-day" class="nav-btn view-btn">Day</button>
      </div>
      <button id="add-btn" class="nav-btn icon-btn" title="New event">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      </button>
    </div>

    <div id="month-view">
      <div id="dow-row"></div>
      <div id="grid"></div>
    </div>

    <div id="time-view">
      <div id="tg-head"></div>
      <div id="tg-allday"></div>
      <div id="tg-scroll">
        <div id="tg-body"></div>
      </div>
    </div>

    <div id="pop" class="hidden">
      <button id="pop-close" title="Close">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
      <div id="pop-head">
        <span id="pop-dot"></span>
        <span id="pop-name"></span>
      </div>
      <div id="pop-time"></div>
      <div id="pop-note"></div>
      <div id="pop-actions">
        <button id="pop-edit" class="pop-act">Edit</button>
        <button id="pop-skip" class="pop-act">Skip this one</button>
        <button id="pop-del" class="pop-act danger">Delete series</button>
      </div>
    </div>

    <div id="modal-back">
      <div id="modal">
        <div id="modal-header">
          <span id="modal-title">New Event</span>
          <button id="modal-close" class="nav-btn">Close</button>
        </div>
        <div id="edit-scope">
          <label class="f">Apply to</label>
          <div id="scope-opts">
            <label><input type="radio" name="scope" value="all" checked> All events</label>
            <label><input type="radio" name="scope" value="following"> This and following</label>
            <label><input type="radio" name="scope" value="only"> Only this one</label>
          </div>
        </div>
        <label class="f">Name</label>
        <input id="f-name" type="text">
        <div id="cat-seg">
          <button type="button" class="seg-btn on" data-cat="timed">Timed</button>
          <button type="button" class="seg-btn" data-cat="allday">All day</button>
          <button type="button" class="seg-btn" data-cat="date">Birthday</button>
        </div>

        <!-- birthday (%date): month + day only -->
        <div class="bf nth-row">
          <div>
            <label class="f">Month</label>
            <select id="f-bmonth"></select>
          </div>
          <div>
            <label class="f">Day</label>
            <input id="f-bday" type="number" min="1" max="31" value="1">
          </div>
        </div>

        <!-- timed / allday: a recurrence -->
        <label class="f rc">Repeats</label>
        <select id="f-kind" class="rc">
          <option value="once">Never — one time only</option>
          <option value="daily">Daily</option>
          <option value="weekly" selected>Weekly, on chosen days</option>
          <option value="monthly">Monthly, on a day number</option>
          <option value="monthly-nth">Monthly, on the Nth weekday</option>
          <option value="yearly">Yearly, on a date</option>
          <option value="every">Every N minutes</option>
        </select>
        <div id="kind-hint" class="rc"></div>
        <div class="nth-row rc">
          <div>
            <label class="f" id="lbl-start">Starting from</label>
            <input id="f-date" type="date">
          </div>
          <div class="tf">
            <label class="f">At time</label>
            <input id="f-time" type="time" value="09:00">
          </div>
          <div class="af">
            <label class="f">For (days)</label>
            <input id="f-days-n" type="number" min="1" value="1">
          </div>
        </div>
        <label class="f wf">On these days</label>
        <div id="f-days" class="wf"></div>
        <label class="f mf">Day of the month (1–31)</label>
        <input id="f-day" type="number" min="1" max="31" value="1" class="mf">
        <div class="nf nth-row">
          <div>
            <label class="f">On the</label>
            <select id="f-ord">
              <option value="first">First</option>
              <option value="second">Second</option>
              <option value="third">Third</option>
              <option value="fourth">Fourth</option>
              <option value="last">Last</option>
            </select>
          </div>
          <div>
            <label class="f">Weekday</label>
            <select id="f-dow"></select>
          </div>
        </div>
        <div class="yf nth-row">
          <div>
            <label class="f">Month</label>
            <select id="f-month"></select>
          </div>
          <div>
            <label class="f">Day</label>
            <input id="f-yday" type="number" min="1" max="31" value="1">
          </div>
        </div>
        <label class="f ef">Repeat every (minutes)</label>
        <input id="f-period" type="number" min="1" value="60" class="ef">
        <div class="rc nth-row">
          <div>
            <label class="f">Ends after (0 = never)</label>
            <input id="f-count" type="number" min="0" value="0">
          </div>
          <div>
            <label class="f">Or ends by date</label>
            <input id="f-until" type="date">
          </div>
        </div>
        <label class="f tf">Duration (minutes — 0 for an instant)</label>
        <input id="f-dur" type="number" min="0" value="60" class="tf">
        <label class="f tf">Timezone</label>
        <select id="f-zone" class="tf"></select>
        <label class="f">Note</label>
        <input id="f-note" type="text">
        <label class="f">Color</label>
        <input id="f-color" type="color" value="#4a6a8a">
        <div id="modal-foot">
          <span id="f-status"></span>
          <button id="f-save" class="nav-btn">Save</button>
        </div>
      </div>
    </div>

    <div id="feeds-back">
      <div id="feeds-modal">
        <div class="feeds-header">
          <span>External Feeds</span>
          <button id="feeds-close" class="nav-btn">Close</button>
        </div>
        <div id="feeds-list"></div>
        <label class="f">Name</label>
        <input id="feed-name" placeholder="main">
        <label class="f">Secret ICS address</label>
        <input id="feed-url" placeholder="https://calendar.google.com/calendar/ical/…/basic.ics">
        <div class="feeds-foot">
          <span id="feeds-status"></span>
          <button id="feed-add" class="nav-btn">Add feed</button>
        </div>
      </div>
    </div>
  </div>
  <script src="/grubbery/calendar/calendar.js"></script>
</body>
</html>
