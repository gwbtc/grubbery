<!doctype html>
<html>
<head>
  <title>assistant</title>
<link rel="icon" type="image/svg+xml" href="/grubbery/tiles/icon/claw.claw_app">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/grubbery/claw/style.css">
</head>
<body>
  <div id="app">
    <div id="header">
      <div>
        <h1 id="asst-title">assistant</h1>
        <div class="sub"><a class="section-link" href="/grubbery/claw/assistants">&larr; assistants</a></div>
      </div>
      <div id="loader"><div class="spin"></div></div>
    </div>

    <div id="asst-meta" class="entity-card" style="display:none">
      <div class="entity-info">
        <span id="m-dot" class="dot off"></span>
        <a id="m-code" class="entity-type code-link" target="_blank"></a>
        <span id="m-recur" class="asst-recur"></span>
      </div>
      <div class="card-actions">
        <button id="m-config" class="hdr-btn">config</button>
        <button id="m-toggle" class="hdr-btn">enable</button>
      </div>
    </div>

    <div class="section-header">
      <h2>files</h2>
      <span></span>
    </div>
    <div class="create-bar">
      <input id="new-file" type="text" placeholder="new file (e.g. context.md)..." autocomplete="off">
      <button class="create-btn" onclick="createFile()">+ new</button>
    </div>
    <div id="files"></div>

    <div id="file-back">
      <div id="file-modal">
        <div id="file-header">
          <span id="ed-name">file</span>
          <div>
            <button id="ed-edit" class="hdr-btn">edit</button>
            <button id="ed-save" class="hdr-btn" style="display:none">save</button>
            <button id="ed-close" class="hdr-btn">close</button>
          </div>
        </div>
        <pre id="ed-view"></pre>
        <textarea id="ed-text" rows="18" style="display:none"></textarea>
        <div id="ed-status"></div>
      </div>
    </div>
  </div>
  <script src="/grubbery/claw/config-modal.js"></script>
  <script src="/grubbery/claw/assistant.js"></script>
</body>
</html>
