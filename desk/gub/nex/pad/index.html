<!doctype html>
<html>
<head>
  <title>Pad</title>
  <link rel="icon" type="image/svg+xml" href="/grubbery/tiles/icon/pad.pad">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    :root {
      --accent: #5b7f71;
      --accent-soft: #eef3f1;
      --ink: #1c2321;
      --muted: #7d8a85;
      --line: #e3e8e6;
      --bg: #fafbfa;
    }
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      color: var(--ink);
      background: var(--bg);
      max-width: 860px;
      margin: 0 auto;
      padding: 1.5rem 2rem 3rem;
    }
    header {
      display: flex; align-items: baseline; justify-content: space-between;
      margin-bottom: 1.5rem;
    }
    header h1 { font-size: 1.25rem; margin: 0; letter-spacing: -0.01em; }
    header h1 a { color: inherit; text-decoration: none; }
    #ship {
      font-family: ui-monospace, Menlo, monospace;
      font-size: 0.8rem; color: var(--muted);
      background: var(--accent-soft); border-radius: 999px;
      padding: 0.2rem 0.7rem;
    }
    .muted { color: var(--muted); }

    /* home */
    #home, #editor-view { display: none; }
    #docs {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
      gap: 0.7rem; margin-bottom: 1.5rem;
    }
    .card {
      display: block; padding: 0.9rem 1rem; background: #fff;
      border: 1px solid var(--line); border-radius: 10px;
      text-decoration: none; color: inherit;
      transition: border-color 0.12s, box-shadow 0.12s;
    }
    .card:hover { border-color: var(--accent); box-shadow: 0 2px 10px rgba(91,127,113,0.12); }
    .card-title { font-weight: 600; margin-bottom: 0.15rem; }
    .card-sub { font-family: ui-monospace, Menlo, monospace; font-size: 0.75rem; color: var(--muted); }
    .empty { color: var(--muted); padding: 1rem 0; grid-column: 1 / -1; }
    .row { display: flex; gap: 0.5rem; margin-bottom: 0.6rem; }
    input {
      font: inherit; padding: 0.5rem 0.7rem; flex: 1;
      border: 1px solid var(--line); border-radius: 8px; background: #fff;
    }
    input:focus { outline: none; border-color: var(--accent); }
    input::placeholder { color: #b3bcb8; }
    button {
      font: inherit; font-weight: 500; padding: 0.5rem 1rem; cursor: pointer;
      border: none; border-radius: 8px; background: var(--accent); color: #fff;
    }
    button:hover { filter: brightness(1.07); }
    .section-label {
      font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.08em;
      color: var(--muted); margin: 1.4rem 0 0.5rem;
    }

    /* editor */
    .topbar { display: flex; align-items: center; gap: 0.6rem; margin-bottom: 0.6rem; }
    #title { font-size: 1.05rem; font-weight: 650; }
    #title-host {
      font-family: ui-monospace, Menlo, monospace; font-size: 0.75rem;
      color: var(--accent); background: var(--accent-soft);
      border-radius: 999px; padding: 0.15rem 0.6rem;
    }
    #title-host:empty { display: none; }
    .topbar .spacer { flex: 1; }
    .topbar a { font-size: 0.85rem; color: var(--muted); text-decoration: none; }
    .topbar a:hover { color: var(--accent); }
    #presence { display: flex; flex-wrap: wrap; gap: 0.4rem; margin-bottom: 0.6rem; min-height: 1.6rem; }
    .chip {
      display: inline-flex; align-items: center; gap: 0.4rem;
      font-family: ui-monospace, Menlo, monospace; font-size: 0.75rem;
      background: #fff; border: 1px solid var(--line); border-radius: 999px;
      padding: 0.2rem 0.65rem;
    }
    .chip .dot { width: 8px; height: 8px; border-radius: 50%; }
    .chip .typing { color: var(--muted); font-style: italic; }
    #pad {
      background: #fff; border: 1px solid var(--line); border-radius: 10px;
      overflow: hidden; min-height: 55vh; position: relative;
    }
    #pad.loading .cm-editor { opacity: 0.4; pointer-events: none; }
    #pad.loading::after {
      content: '';
      position: absolute; top: 50%; left: 50%; margin: -14px 0 0 -14px;
      width: 28px; height: 28px; border-radius: 50%;
      border: 3px solid var(--line); border-top-color: var(--accent);
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #pad .cm-editor { min-height: 55vh; }
    #pad .cm-gutters { background: transparent; border-right: 1px solid var(--line); color: #c2cac6; }
    #pad .cm-activeLine { background: rgba(91,127,113,0.05); }
    .cm-ySelectionInfo {
      font-family: system-ui, sans-serif !important;
      font-size: 0.65rem !important;
      padding: 0.1rem 0.4rem !important;
      border-radius: 4px !important;
      opacity: 1 !important;
    }
    #statusbar {
      display: flex; justify-content: space-between;
      margin-top: 0.5rem; font-size: 0.78rem; color: var(--muted);
      font-family: ui-monospace, Menlo, monospace;
    }
  </style>
</head>
<body>
  <header>
    <h1><a href="?">◆ Pad</a></h1>
    <span id="ship"></span>
  </header>
  <div id="home">
    <div id="docs">Loading…</div>
    <div class="section-label">New pad</div>
    <div class="row">
      <input id="newname" placeholder="pad-name (a-z, 0-9, -)">
      <button id="create">Create</button>
    </div>
    <div class="section-label">Open a pad on another ship</div>
    <div class="row">
      <input id="openhost" placeholder="~host" style="flex: 0 0 10rem">
      <input id="opendoc" placeholder="pad name">
      <button id="open">Open</button>
    </div>
  </div>
  <div id="editor-view">
    <div class="topbar">
      <span id="title"></span>
      <span id="title-host"></span>
      <span class="spacer"></span>
      <a href="?">all pads</a>
    </div>
    <div id="presence"></div>
    <div id="pad"></div>
    <div id="statusbar">
      <span id="status">connecting</span>
      <span id="count"></span>
    </div>
  </div>
  <script src="/grubbery/pad/pad.js"></script>
</body>
</html>
