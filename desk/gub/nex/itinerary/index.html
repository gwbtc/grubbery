<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Itinerary</title>
  <link rel="icon" type="image/svg+xml" href="/grubbery/itinerary/icon.svg">
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.css" />
  <link rel="stylesheet" href="/grubbery/itinerary/style.css">
  <link rel="stylesheet" href="/grubbery/itinerary/chat.css">
</head>
<body>
  <div id="toolbar">
    <div id="toolbar-left">
      <a id="btn-home" href="/grubbery/itinerary" title="All trips"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg></a>
      <drop-menu id="itin-menu" align="start">
        <button slot="trigger" id="btn-itins" title="Itineraries">
          <span id="map-name">Itinerary</span> &#9662;
        </button>
        <div id="itin-menu-items"></div>
        <button id="menu-new" data-keep-open>+ New itinerary</button>
      </drop-menu>
    </div>
    <div id="toolbar-right">
      <button id="btn-zone" title="Draw zone">&#9634;</button>
      <button id="btn-add" title="Add pin">+</button>
      <div id="view-toggle">
        <button id="btn-map" class="active">Map</button>
        <button id="btn-sched">Schedule</button>
      </div>
    </div>
  </div>

  <div id="filters"></div>

  <div id="map-view">
    <split-view id="panel-split" orientation="horizontal" primary="end" size="340" min="300" max="720" persist="itin-panel">
      <div slot="start" id="map-wrap-outer">
        <div id="sched-wrap" class="hidden">
          <div id="sched-head">
            <span id="sched-title">Schedule</span>
            <span id="sched-tz" class="sched-muted"></span>
            <span id="sched-legend"></span>
          </div>
          <div id="sched-scroll"><div id="sched-days"></div></div>
        </div>
      <div id="map-wrap">
        <div id="map-container"></div>
        <div id="map-search">
          <input id="search-input" type="text" placeholder="Search places..." autocomplete="off">
          <div id="search-results" class="hidden"></div>
        </div>
        <button id="btn-proj" title="Globe view">&#127760;</button>
        <button id="btn-zones" title="Show/hide zones">&#9634;</button>
        <div id="draw-bar" class="hidden">
          <span id="draw-hint">Click the map to outline a zone</span>
          <button id="draw-finish">Finish</button>
          <button id="draw-cancel">Cancel</button>
        </div>
      </div>
      </div>
      <div slot="end" id="side-panel">
        <button id="panel-collapse" title="Collapse sidebar">&#x276F;</button>
        <tab-group id="side-tabs" persist="itin-side-tabs">
          <div tab-label="Trip" id="trip-panel">
            <div id="about-head">
              <button id="about-edit">edit</button>
            </div>
            <div id="about-md" class="about-empty">No description yet.</div>
          </div>
          <div tab-label="Todos" id="todos-panel">
            <div id="todo-list"></div>
            <div id="todo-new-row">
              <input id="todo-new" type="text" placeholder="Add a to-do..." autocomplete="off">
            </div>
          </div>
          <div tab-label="Places" id="pin-panel">
            <tab-group id="places-tabs" persist="itin-places-tabs">
              <div tab-label="Pins" id="pins-sub">
                <input id="panel-search" type="text" placeholder="Search pins..." autocomplete="off">
                <div id="panel-list"></div>
              </div>
              <div tab-label="Zones" id="zones-sub">
                <div id="zone-list"></div>
              </div>
            </tab-group>
          </div>
          <div tab-label="Events" id="events-panel">
            <tab-group id="events-tabs" persist="itin-events-tabs">
              <div tab-label="Scheduled" id="events-actual">
                <div id="actual-list" class="event-list"></div>
              </div>
              <div tab-label="Unscheduled" id="events-proposed">
                <div id="proposed-list" class="event-list"></div>
                <button id="idea-add">+ New event</button>
              </div>
            </tab-group>
          </div>
          <div tab-label="Files" id="files-mount"></div>
          <div tab-label="Chat" id="chat-mount"></div>
        </tab-group>
      </div>
    </split-view>
  </div>

  <modal-dialog id="pin-modal">
    <div class="form-header">
      <span id="form-title">Add Pin</span>
    </div>
    <input id="pin-name" type="text" placeholder="Name" autocomplete="off">
    <input id="pin-desc" type="text" placeholder="Description" autocomplete="off">
    <select id="pin-cat"></select>
    <input id="pin-from" type="text" placeholder="Recommended by (comma-separated)" autocomplete="off">
    <textarea id="pin-notes" rows="3" placeholder="Notes (optional)"></textarea>
    <div id="pin-coords">
      <input id="pin-lat" type="number" step="any" placeholder="Latitude">
      <input id="pin-lng" type="number" step="any" placeholder="Longitude">
    </div>
    <div class="form-actions">
      <button id="form-delete" class="btn-danger hidden">Delete</button>
      <button data-close class="btn-plain">Cancel</button>
      <button id="form-save" class="btn-primary">Save</button>
    </div>
    <div id="form-status" class="form-status"></div>
  </modal-dialog>

  <modal-dialog id="zone-modal">
    <div class="form-header">
      <span id="zone-form-title">Add Zone</span>
    </div>
    <input id="zone-name" type="text" placeholder="Name" autocomplete="off">
    <input id="zone-desc" type="text" placeholder="Description" autocomplete="off">
    <select id="zone-cat"></select>
    <textarea id="zone-notes" rows="3" placeholder="Notes (optional)"></textarea>
    <div class="form-actions">
      <button id="zone-delete" class="btn-danger hidden">Delete</button>
      <button data-close class="btn-plain">Cancel</button>
      <button id="zone-save" class="btn-primary">Save</button>
    </div>
    <div id="zone-form-status" class="form-status"></div>
  </modal-dialog>

  <modal-dialog id="sched-modal">
    <div id="sched-view" class="hidden">
      <div id="sv-title"></div>
      <div id="sv-when"></div>
      <div id="sv-badges"></div>
      <div id="sv-notes"></div>
      <div class="form-actions">
        <button data-close class="btn-plain">Close</button>
        <button id="sv-edit" class="btn-primary">Edit</button>
      </div>
    </div>
    <div id="sched-form-fields">
    <div class="form-header">
      <span id="sched-form-title">Add to schedule</span>
    </div>
    <input id="sched-name" type="text" placeholder="Title" autocomplete="off">
    <div id="sched-when">
      <input id="sched-date" type="date">
      <input id="sched-start" type="time">
      <input id="sched-end" type="time">
    </div>
    <select id="sched-status">
      <option value="fixed">fixed</option>
      <option value="tentative">tentative</option>
    </select>
    <select id="sched-pin"></select>
    <textarea id="sched-notes" rows="2" placeholder="Notes (optional)"></textarea>
    <div class="form-actions">
      <button id="sched-delete" class="btn-danger hidden">Delete</button>
      <button data-close class="btn-plain">Cancel</button>
      <button id="sched-save" class="btn-primary">Save</button>
    </div>
    <div id="sched-form-status" class="form-status"></div>
    </div>
  </modal-dialog>

  <modal-dialog id="about-modal">
    <div class="form-header">
      <span>About this trip</span>
    </div>
    <textarea id="about-text" rows="12" placeholder="Trip purpose, plans, links — markdown"></textarea>
    <div class="form-actions">
      <button data-close class="btn-plain">Cancel</button>
      <button id="about-save" class="btn-primary">Save</button>
    </div>
    <div id="about-status" class="form-status"></div>
  </modal-dialog>

  <script type="module" src="/grubbery/itinerary/ui/components.js"></script>
  <script src="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.js"></script>
  <script src="/grubbery/itinerary/app.js"></script>
  <script src="/grubbery/itinerary/marked.min.js"></script>
  <script src="/grubbery/itinerary/chat.js"></script>
  <script src="/grubbery/itinerary/ui/file-preview.js"></script>
  <script src="/grubbery/itinerary/ui/file-manager.js"></script>
  <script src="/grubbery/itinerary/files.js"></script>
</body>
</html>
