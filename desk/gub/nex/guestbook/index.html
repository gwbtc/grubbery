<title>Guestbook</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: monospace; max-width: 600px; margin: 40px auto; padding: 0 20px; background: #111; color: #ddd; }
  h1 { margin-bottom: 20px; color: #fff; }
  form { display: flex; gap: 8px; margin-bottom: 30px; }
  input { flex: 1; padding: 8px; background: #222; border: 1px solid #444; color: #ddd; font-family: monospace; }
  button { padding: 8px 16px; background: #333; border: 1px solid #555; color: #ddd; cursor: pointer; font-family: monospace; }
  button:hover { background: #444; }
  .entry { padding: 12px; border-bottom: 1px solid #222; }
  .entry .name { color: #8cf; font-weight: bold; }
  .entry .time { color: #666; font-size: 0.85em; margin-left: 8px; }
  .entry .msg { margin-top: 4px; }
  #entries { margin-top: 10px; }
  .error { color: #f66; margin: 10px 0; }
  #signer { color: #888; margin-bottom: 10px; }
  #signer .ship { color: #8cf; }
  #signer a { color: #8cf; }
</style>
<h1>Guestbook</h1>
<div id="signer"></div>
<form id="post-form" hidden>
  <input id="msg-input" placeholder="message" required maxlength="256">
  <button type="submit">post</button>
</form>
<div id="entries"></div>
<script src="/grubbery/guestbook/guestbook.js"></script>
