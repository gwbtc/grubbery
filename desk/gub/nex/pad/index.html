<!doctype html>
<html>
<head>
  <title>Pad</title>
  <link rel="icon" type="image/svg+xml" href="/grubbery/tiles/icon/pad.pad">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body { font-family: monospace; max-width: 720px; margin: 0 auto; padding: 2rem; }
    h1 { font-size: 1.4rem; }
    .muted { opacity: 0.5; }
    .row { display: flex; gap: 0.5rem; margin-bottom: 0.5rem; }
    input { font-family: monospace; padding: 0.4rem; border: 1px solid #ccc; border-radius: 4px; flex: 1; }
    button { font-family: monospace; padding: 0.4rem 0.8rem; border: 1px solid #ccc; border-radius: 4px; background: none; cursor: pointer; }
    button:hover { background: #eee; }
    #docs { display: flex; flex-direction: column; gap: 0.3rem; margin: 1rem 0; }
    .doc { padding: 0.5rem; border: 1px solid #ccc; border-radius: 4px; text-decoration: none; color: inherit; }
    .doc:hover { background: #eee; }
    #pad { width: 100%; height: 60vh; font-family: monospace; font-size: 0.95rem; padding: 0.8rem; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; resize: vertical; }
    #statusbar { display: flex; justify-content: space-between; margin-top: 0.5rem; font-size: 0.8rem; }
    #home, #editor-view { display: none; }
  </style>
</head>
<body>
  <h1>Pad <span id="ship" class="muted"></span></h1>
  <div id="home">
    <div id="docs">Loading…</div>
    <div class="row">
      <input id="newname" placeholder="new pad name (a-z, 0-9, -)">
      <button id="create">Create</button>
    </div>
    <div class="row">
      <input id="openhost" placeholder="~host">
      <input id="opendoc" placeholder="pad name">
      <button id="open">Open remote</button>
    </div>
  </div>
  <div id="editor-view">
    <div class="row" style="justify-content: space-between">
      <span id="title"></span>
      <a href="?" class="muted">all pads</a>
    </div>
    <textarea id="pad" spellcheck="false"></textarea>
    <div id="statusbar">
      <span id="status" class="muted">connecting</span>
      <span id="count" class="muted"></span>
    </div>
  </div>
  <script src="/grubbery/pad/pad.js"></script>
</body>
</html>
