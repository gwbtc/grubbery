<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Docs</title>
<link rel="icon" type="image/svg+xml" href="/grubbery/forge/icon.svg">
<style>
  :root {
    --bg: #ffffff; --fg: #1a1a1a; --muted: #6b6b6b;
    --line: #e6e6e6; --accent: #3d3a45; --sidebar: #fafafa;
    --code-bg: #f4f4f5;
  }
  * { box-sizing: border-box; }
  /* web components load as modules (own scope, no global-name collisions), so
     they're briefly undefined during parse. Hide them until they upgrade — and
     permanently if a script ever fails — so slotted content never renders in raw
     stacked flow. split-view holds the whole layout; float-window the chat. */
  split-view:not(:defined), float-window:not(:defined) { display: none !important; }
  /* while split-view is still upgrading it's display:none, so the footer would
     be the only flex child and render at the TOP. Hide it until split-view is
     defined, so the whole layout appears together, footer at the bottom. */
  #docs:not(:defined) ~ #docs-foot { display: none !important; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 15px/1.65 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex; flex-direction: column; height: 100vh; overflow: hidden;
  }
  /* the resizable <split-view> fills everything above the footer; the footer
     sits below it in normal flow, so it never overlaps the sidebar. */
  #docs {
    flex: 1 1 auto; min-height: 0;
    --sv-border: var(--line);
  }
  #sidebar {
    position: relative;
    height: 100%; background: var(--sidebar);
    border-right: 1px solid var(--line); padding: 24px 0;
    overflow-y: auto; overflow-x: hidden;
    /* a floor so the nav never compresses to the point of wrapping — below
       this the pane just clips, it never reflows the labels. */
    min-width: 190px;
  }
  #sb-collapse {
    position: absolute; top: 10px; right: 8px; z-index: 2;
    width: 22px; height: 22px; display: flex; align-items: center;
    justify-content: center; border: none; background: none; cursor: pointer;
    color: var(--muted); border-radius: 5px; font-size: 15px; line-height: 1;
  }
  #sb-collapse:hover { background: #ececec; color: var(--fg); }
  #sidebar h1 {
    font-size: 13px; text-transform: uppercase; letter-spacing: 0.08em;
    color: var(--muted); margin: 0 0 12px; padding: 0 24px;
  }
  #home-link {
    display: flex; align-items: center; gap: 7px; padding: 0 24px 4px;
    margin-bottom: 18px; color: var(--muted); text-decoration: none; font-size: 13px;
  }
  #home-link:hover { color: var(--fg); }
  #home-link svg { width: 15px; height: 15px; }
  #nav, #nav ul { list-style: none; margin: 0; padding: 0; }
  #nav a {
    display: block; padding: 6px 24px; color: var(--fg);
    text-decoration: none; border-left: 2px solid transparent;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  #nav a:hover { background: #f0f0f0; }
  #nav a.active { border-left-color: var(--accent); font-weight: 600; background: #f0f0f0; }
  #nav .sec-head {
    padding: 8px 24px 4px; font-size: 12px; text-transform: uppercase;
    letter-spacing: 0.06em; color: var(--muted); cursor: pointer;
    user-select: none; display: flex; align-items: center; gap: 6px;
    white-space: nowrap; overflow: hidden;
  }
  #nav .sec-head::before { content: "▾"; font-size: 10px; transition: transform 0.1s; }
  #nav .sec.collapsed > .sec-head::before { transform: rotate(-90deg); }
  #nav .sec.collapsed > ul { display: none; }
  #nav .sec ul a { padding-left: 36px; }
  /* a section nested in a section: its head and pages step in one level and
     the head drops the uppercase so it reads as a subsection */
  #nav .sec .sec > .sec-head { padding-left: 36px; text-transform: none; letter-spacing: 0; font-size: 12.5px; }
  #nav .sec .sec ul a { padding-left: 48px; }
  #nav .sec-cov {
    display: block; padding: 6px 24px; color: var(--fg); text-decoration: none;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  #nav .sec-cov:hover { background: #f0f0f0; }
  /* dashboard mode: a freshness-colored % beside a scoped node's name, itself
     the link into that node's coverage view */
  .nav-cov-pct {
    font: 10px ui-monospace, monospace; flex: 0 0 auto; text-align: right;
    padding: 1px 24px 1px 8px; cursor: pointer;
  }
  #nav .sec-head .nav-cov-pct { padding-right: 6px; }
  .nav-cov-pct:hover { text-decoration: underline; }
  .nav-cov-pct.f { color: #1a7f37; }
  .nav-cov-pct.d { color: #9a6700; }
  /* the coverage row atop the sidebar: a link to the full overview + the apex % */
  #nav .cov-toggle {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    padding: 4px 24px 10px;
  }
  #nav .cov-toggle .nav-cov-pct { padding-right: 0; }
  #nav .cov-toplink {
    font-size: 13px; font-weight: 600; color: var(--fg); text-decoration: none;
  }
  #nav .cov-toplink:hover { text-decoration: underline; }

  #content { height: 100%; min-width: 0; display: flex; flex-direction: column; overflow-y: auto; }
  #topbar {
    position: sticky; top: 0; z-index: 20; background: rgba(255,255,255,0.9);
    backdrop-filter: blur(6px); border-bottom: 1px solid var(--line);
    display: flex; justify-content: flex-end; padding: 12px 40px;
  }
  .chat-fab {
    position: fixed; bottom: 22px; right: 22px; z-index: 50;
    display: flex; align-items: center; gap: 8px;
    height: 46px; padding: 0 18px 0 15px;
    background: var(--accent, #3d3a45); color: #fff; border: none; border-radius: 23px;
    font: 600 14px/1 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    cursor: pointer; box-shadow: 0 6px 22px rgba(0,0,0,0.22);
    transition: transform 0.12s ease, box-shadow 0.12s ease, opacity 0.12s ease;
  }
  .chat-fab[hidden] { display: none; }
  .chat-fab:hover { transform: translateY(-1px); box-shadow: 0 9px 28px rgba(0,0,0,0.26); }
  .chat-fab svg { width: 17px; height: 17px; transition: transform 0.14s ease; }
  .chat-fab.active svg { transform: rotate(180deg); }
  /* the chat pane fills the float-window's body edge to edge */
  float-window::part(body) { padding: 0; display: flex; flex-direction: column; }
  #chat-host { flex: 1; min-height: 0; display: flex; flex-direction: column; background: #fff; }
  #chat-host .chat-none { padding: 24px 18px; color: var(--muted); font-size: 13px; line-height: 1.6; }
  #search-wrap { position: relative; width: 280px; }
  #search-input {
    width: 100%; background: #fff; border: 1px solid var(--line); border-radius: 8px;
    padding: 8px 12px; font-size: 13px; color: var(--fg); outline: none;
    transition: border-color 0.12s, box-shadow 0.12s;
  }
  #search-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(61,58,69,0.12); }
  #search-results {
    position: absolute; top: calc(100% + 6px); right: 0; width: 380px; max-width: 80vw;
    list-style: none; margin: 0; padding: 6px; background: #fff; border: 1px solid var(--line);
    border-radius: 10px; box-shadow: 0 12px 40px rgba(0,0,0,0.14); max-height: 60vh;
    overflow-y: auto; z-index: 30;
  }
  #search-results.hidden { display: none; }
  #search-results .result { padding: 9px 12px; border-radius: 7px; cursor: pointer; }
  #search-results .result.sel { background: #eef1ff; }
  #search-results .r-title { font-weight: 600; font-size: 13px; }
  #search-results .r-snip {
    font-size: 12px; color: var(--muted); margin-top: 2px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  #search-results .no-hits { padding: 14px; color: var(--muted); font-style: italic; text-align: center; }

  #doc-wrap { flex: 1; display: flex; justify-content: center; align-items: flex-start; gap: 24px; }
  #doc { max-width: 720px; width: 100%; padding: 40px 40px 64px; }
  /* "On this page": the current doc's headings, sticky on the right, with a
     scroll-spy highlight. Hidden on non-doc views and on narrow viewports. */
  #onthispage {
    position: sticky; top: 58px; align-self: flex-start;
    flex: 0 0 190px; width: 190px; padding: 8px 24px 40px 0;
    max-height: calc(100vh - 78px); overflow-y: auto;
    font: 12.5px/1.4 -apple-system, system-ui, sans-serif;
  }
  #onthispage .otp-h {
    text-transform: uppercase; letter-spacing: 0.05em; font-size: 10.5px;
    font-weight: 600; color: var(--muted); margin: 0 0 10px 12px;
  }
  #onthispage a {
    display: block; color: var(--muted); text-decoration: none;
    padding: 3px 0 3px 12px; border-left: 2px solid var(--line);
    white-space: normal;
  }
  #onthispage a:hover { color: var(--fg); }
  #onthispage a.active { color: var(--fg); border-left-color: var(--accent); }
  #onthispage a.lvl3 { padding-left: 24px; font-size: 12px; }
  #onthispage a.lvl4 { padding-left: 36px; font-size: 11.5px; }
  @media (max-width: 1080px) { #onthispage { display: none !important; } }
  /* leave room for the sticky topbar when scrolling a heading into view
     (On-this-page clicks, anchor jumps) so it isn't hidden beneath it */
  #doc h1, #doc h2, #doc h3, #doc h4 { scroll-margin-top: 72px; }
  #doc h1 { font-size: 30px; margin: 0 0 8px; }
  #doc h2 { font-size: 21px; margin: 36px 0 10px; border-bottom: 1px solid var(--line); padding-bottom: 6px; }
  #doc h3 { font-size: 17px; margin: 28px 0 8px; }
  #doc h4 { font-size: 15px; margin: 22px 0 6px; }
  #doc p, #doc li { color: #2a2a2a; }
  #doc code { background: var(--code-bg); padding: 2px 5px; border-radius: 4px; font-size: 0.9em; }
  #doc pre { background: var(--code-bg); padding: 16px; border-radius: 8px; overflow-x: auto; }
  #doc pre code { background: none; padding: 0; }
  #doc a { color: #2b6cb0; }
  #doc blockquote { border-left: 3px solid var(--line); margin: 0; padding-left: 16px; color: var(--muted); }
  /* callouts: `> [!type] title` admonition boxes (see upgradeCallouts) */
  #doc .callout { border: 1px solid; border-radius: 8px; padding: 12px 16px; margin: 0 0 18px; }
  #doc .callout .callout-h { font-weight: 600; font-size: 12.5px; margin-bottom: 5px; }
  #doc .callout > p { margin: 6px 0 0; }
  #doc .callout > p:first-of-type { margin-top: 0; }
  #doc .callout-background { background: #f6f5fb; border-color: #e5e0f2; }
  #doc .callout-background .callout-h { color: #6b5fa8; }
  #doc .callout-note { background: #eef4fb; border-color: #d6e3f2; }
  #doc .callout-note .callout-h { color: #2b6cb0; }
  #doc .callout-tip { background: #eef7f0; border-color: #d4e8db; }
  #doc .callout-tip .callout-h { color: #1a7f37; }
  #doc .callout-warn, #doc .callout-warning { background: #fff8ec; border-color: #f0dcae; }
  #doc .callout-warn .callout-h, #doc .callout-warning .callout-h { color: #9a6700; }
  #empty { color: var(--muted); }
  mark { background: #ffe9a8; color: inherit; border-radius: 2px; }

  /* skeleton loader shown while a doc's markdown is in flight */
  .doc-skeleton { animation: sk-fade 0.2s ease; }
  .sk {
    height: 15px; margin: 13px 0; border-radius: 6px;
    background: linear-gradient(90deg, #ececec 25%, #f6f6f6 37%, #ececec 63%);
    background-size: 400% 100%; animation: sk-shimmer 1.4s ease infinite;
  }
  .sk-title { height: 30px; width: 52%; margin: 0 0 28px; }
  .sk-sub { height: 20px; width: 34%; margin: 30px 0 14px; }
  .sk-short { width: 42%; }
  .sk-gap { height: 26px; background: none; animation: none; }
  @keyframes sk-shimmer { 0% { background-position: 100% 0; } 100% { background-position: 0 0; } }
  @keyframes sk-fade { from { opacity: 0; } to { opacity: 1; } }
  /* code-shaped shimmer, shown where a source snippet is in flight (live embeds,
     the coverage heatmap source) instead of a bare "loading…" line. */
  .code-sk { padding: 14px 16px; animation: sk-fade 0.2s ease; }
  .code-sk i {
    display: block; height: 10px; margin: 8px 0; border-radius: 4px;
    background: linear-gradient(90deg, #ececec 25%, #f6f6f6 37%, #ececec 63%);
    background-size: 400% 100%; animation: sk-shimmer 1.4s ease infinite;
  }
  #docs-foot {
    flex: 0 0 auto;
    padding: 10px 40px; color: var(--muted); font-size: 12px;
    font-style: italic; text-align: center;
    background: var(--sidebar);
    border-top: 1px solid var(--line);
  }

  /* live code embeds (real source, shiki-highlighted) */
  .live-wrap { margin: 18px 0; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; scroll-margin-top: 72px; }
  /* the block a coverage link brought you to: marked until the next page */
  .live-wrap.live-focus { border-color: #d4a72c; box-shadow: 0 0 0 3px #fff1c2; }
  .live-wrap.live-focus > .live-head { background: #fff8dc; }
  .live-head {
    font: 12px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--muted);
    background: var(--sidebar); padding: 7px 14px; border-bottom: 1px solid var(--line);
  }
  .live-body pre, .live-body .shiki {
    margin: 0; padding: 14px 16px; overflow-x: auto; font-size: 13px; line-height: 1.5;
  }
</style>
</head>
<body>
  <split-view id="docs" size="240px" min="190" max="420" persist="docs-sidebar">
    <nav id="sidebar" slot="start">
      <button id="sb-collapse" title="Collapse sidebar" aria-label="Collapse sidebar">‹</button>
      <a id="home-link" href="/grubbery/forge" title="Back to the repo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
        Repo
      </a>
      <h1>Handbook</h1>
      <ul id="nav"></ul>
    </nav>
    <main id="content" slot="end">
      <header id="topbar">
        <div id="search-wrap">
          <input id="search-input" type="text" placeholder="Search docs…  ⌘K" autocomplete="off" spellcheck="false">
          <ul id="search-results" class="hidden"></ul>
        </div>
      </header>
      <!-- the handbook chat launcher: the shell docs' floating button -->
      <button id="chat-toggle" class="chat-fab" title="Ask the repo's clanker about the handbook (⌘J)" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"/></svg>
        <span>Ask the docs… &#8984;J</span>
      </button>
      <!-- the handbook chat: the repo's clanker (forge/<repo>.clanker in the
           clanker collection), its `docs` chat, shown in clanker's OWN chat
           pane (viewer.js) mounted in a <float-window> (draggable, resizable,
           built on open by docs-reader.js). forge only says where the log is. -->
      <div id="doc-wrap">
        <article id="doc">
          <div class="doc-skeleton">
            <div class="sk sk-title"></div>
            <div class="sk"></div><div class="sk"></div><div class="sk sk-short"></div>
            <div class="sk-gap"></div>
            <div class="sk sk-sub"></div>
            <div class="sk"></div><div class="sk"></div><div class="sk"></div>
            <div class="sk sk-short"></div>
          </div>
        </article>
        <aside id="onthispage" hidden></aside>
      </div>
    </main>
  </split-view>
  <footer id="docs-foot">
    This handbook began as an LLM-automated first pass and is being adapted by
    hand — treat specifics as provisional.
  </footer>

  <!-- split-view comes from forge's components.js bundle (classic script that
       defines the web components). No chat window here — this is the reader
       served per repo by forge. docs-reader.js derives the repo + API base
       from its own URL (/grubbery/forge/repo/<name>/docs). -->
  <script src="/grubbery/forge/components.js"></script>
  <script src="/grubbery/forge/marked.min.js"></script>
  <script src="/grubbery/forge/docs-reader.js"></script>
</body>
</html>
