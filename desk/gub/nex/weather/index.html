<!doctype html>
<html>
<head>
  <title>Weather</title>
  <link rel="icon" type="image/svg+xml" href="/grubbery/tiles/icon/weather.weather">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.css" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: Inter, sans-serif; background: #f4f6f9; color: #111; }
    #app { max-width: 780px; margin: 0 auto; padding: 24px 20px; }
    #head { display: flex; align-items: center; gap: 8px; margin-bottom: 16px; }
    h1 { font-size: 20px; flex: 1; }
    .btn { font-size: 13px; padding: 8px 14px; border-radius: 8px; border: 1px solid #ddd; background: white; color: #555; cursor: pointer; font-family: inherit; }
    .btn:hover { background: #f5f5f5; }
    .btn.primary { background: #4a90d9; color: white; border-color: #4a90d9; }
    .btn.active { background: #3d3a45; color: white; border-color: #3d3a45; }
    #add-row { display: flex; gap: 8px; margin-bottom: 18px; }
    #add-name { flex: 1; font-size: 14px; padding: 9px 12px; border: 1px solid #ddd; border-radius: 8px; font-family: inherit; outline: none; background: white; }
    #add-name:focus { border-color: #4a90d9; box-shadow: 0 0 0 3px rgba(74,144,217,0.15); }

    #map-wrap { display: none; height: 480px; border-radius: 16px; overflow: hidden; margin-bottom: 18px; position: relative; }
    #map { position: absolute; inset: 0; }
    #radar-bar { position: absolute; left: 10px; bottom: 10px; z-index: 5; display: flex; gap: 6px; align-items: center; background: rgba(255,255,255,0.92); border-radius: 8px; padding: 6px 10px; font-size: 12px; }
    .t-chip { background: #3d3a45; color: white; font-size: 12px; font-weight: 700; padding: 4px 8px; border-radius: 12px; border: 2px solid white; box-shadow: 0 1px 4px rgba(0,0,0,0.3); cursor: pointer; white-space: nowrap; }

    .card { border-radius: 18px; padding: 20px 22px; margin-bottom: 16px; color: white; position: relative; overflow: hidden; }
    .c-top { display: flex; align-items: center; gap: 4px; }
    .c-left { flex: 1; min-width: 0; }
    .c-name { font-size: 14px; font-weight: 600; opacity: 0.92; }
    .c-temp { font-size: 46px; font-weight: 700; line-height: 1.05; }
    .c-word { font-size: 14px; opacity: 0.92; }
    .c-meta { font-size: 12px; opacity: 0.78; margin-top: 6px; line-height: 1.5; }
    .c-icon { width: 110px; height: 110px; flex-shrink: 0; margin: -10px -8px; }
    .c-del { position: absolute; top: 12px; right: 14px; background: none; border: none; color: rgba(255,255,255,0.55); font-size: 16px; cursor: pointer; border-radius: 6px; padding: 2px 8px; z-index: 2; }
    .c-del:hover { background: rgba(255,255,255,0.15); color: white; }

    .hourly { margin-top: 14px; background: rgba(255,255,255,0.12); border-radius: 12px; padding: 10px 8px 4px; }
    .hourly svg { display: block; width: 100%; }

    .week { margin-top: 10px; }
    .w-row { display: grid; grid-template-columns: 44px 34px 40px 1fr 34px 34px; gap: 8px; align-items: center; padding: 5px 4px; font-size: 13px; }
    .w-day { opacity: 0.9; }
    .w-icon { width: 32px; height: 32px; }
    .w-pp { font-size: 11px; opacity: 0.75; text-align: right; }
    .w-lo { opacity: 0.65; text-align: right; font-variant-numeric: tabular-nums; }
    .w-hi { font-weight: 700; font-variant-numeric: tabular-nums; }
    .w-head { font-size: 10px; text-transform: uppercase; letter-spacing: 0.5px; opacity: 0.6; padding: 0 4px 2px; }
    .w-head .w-hi, .w-head .w-lo, .w-head .w-pp { font-size: 10px; font-weight: 600; opacity: 1; }
    .w-mid { text-align: center; }
    .w-bar-track { position: relative; height: 5px; border-radius: 3px; background: rgba(255,255,255,0.18); }
    .w-bar { position: absolute; top: 0; bottom: 0; border-radius: 3px; min-width: 6px; }
    .w-grid { position: absolute; top: -3px; bottom: -3px; width: 1px; background: rgba(255,255,255,0.25); }
    .w-axis { padding-top: 0; }
    .w-axis-track { position: relative; height: 14px; }
    .w-tick { position: absolute; top: 1px; transform: translateX(-50%); font-size: 9px; opacity: 0.65; font-variant-numeric: tabular-nums; }

    .empty { color: #999; font-size: 14px; padding: 40px 0; text-align: center; }
    #stamp { font-size: 11px; color: #aab; text-align: center; margin-top: 6px; }
  </style>
</head>
<body>
  <div id="app">
    <div id="head">
      <h1>Weather</h1>
      <button class="btn" id="view-map">map</button>
      <button class="btn" id="unit-toggle">°C</button>
      <button class="btn" id="refresh">refresh</button>
    </div>
    <div id="add-row">
      <input id="add-name" type="text" placeholder="add a place — city name">
      <button class="btn primary" id="add-btn">add</button>
    </div>
    <div id="map-wrap">
      <div id="map"></div>
      <div id="radar-bar">
        <button class="btn" id="radar-play" style="padding:2px 10px">▶</button>
        <span id="radar-time">radar</span>
      </div>
    </div>
    <div id="cards"></div>
    <div id="stamp"></div>
  </div>
  <script src="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.js"></script>
  <script src="/grubbery/weather/app.js"></script>
</body>
</html>
