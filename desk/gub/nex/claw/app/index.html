<!doctype html>
<html>
<head>
  <title>claw</title>
<link rel="icon" type="image/svg+xml" href="/grubbery/tiles/icon/claw.claw_app">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/grubbery/claw/style.css">
</head>
<body>
  <div id="app">
    <div id="header">
      <div>
        <h1>claw</h1>
        <div class="sub">agents &amp; assistants</div>
      </div>
      <div id="loader"><div class="spin"></div></div>
    </div>

    <div id="cfg-backdrop">
      <div id="cfg-modal">
        <div id="cfg-header">
          <span id="cfg-title">Config</span>
          <div>
            <button id="cfg-save" class="hdr-btn">save</button>
            <button id="cfg-close" class="hdr-btn">close</button>
          </div>
        </div>
        <textarea id="cfg-json" rows="10" placeholder="{}"></textarea>
        <div id="cfg-status"></div>
      </div>
    </div>

    <div class="section-header">
      <h2>assistants</h2>
      <a class="section-link" href="/grubbery/claw/assistants">manage &rarr;</a>
    </div>
    <div id="assistants"></div>

    <div class="section-header"><h2>agents</h2></div>
    <div class="create-bar">
      <input id="agent-name" type="text" placeholder="agent name..." autocomplete="off">
      <button class="create-btn" onclick="createEntity('agents')">+ new</button>
    </div>
    <div id="agents"></div>

    <div class="section-header"><h2>apis</h2></div>
    <div class="create-bar">
      <input id="api-name" type="text" placeholder="name..." autocomplete="off">
      <input id="api-type" type="text" placeholder="type (e.g. anthropic)" autocomplete="off">
      <button class="create-btn" onclick="createEntity('apis')">+ new</button>
    </div>
    <div id="apis"></div>

    <div class="section-header"><h2>channels</h2></div>
    <div class="create-bar">
      <input id="ch-name" type="text" placeholder="name..." autocomplete="off">
      <input id="ch-type" type="text" placeholder="type (e.g. telegram)" autocomplete="off">
      <button class="create-btn" onclick="createEntity('channels')">+ new</button>
    </div>
    <div id="channels"></div>
  </div>
  <script src="/grubbery/claw/app.js"></script>
</body>
</html>
