<!doctype html>
<html>
<head>
  <title>goals</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/grubbery/goals/style.css">
</head>
<body>
  <div id="app">
    <div id="header">
      <div>
        <h1>goals</h1>
        <div class="sub">structured intent</div>
      </div>
      <div id="hdr-actions">
        <select id="store-select"></select>
        <button id="new-store" class="hdr-btn" title="New store">+ store</button>
        <span class="hdr-sep"></span>
        <div id="view-seg">
          <button id="view-tree" class="seg">tree</button>
          <button id="view-frontier" class="seg" title="What's ready to do now">frontier</button>
          <button id="view-gantt" class="seg" title="Dependency chains, left to right">gantt</button>
          <button id="view-kanban" class="seg" title="Blocked / ready / started / done">kanban</button>
        </div>
        <span class="hdr-sep"></span>
        <button id="new-root" class="hdr-btn primary">+ goal</button>
      </div>
      <div id="loader"><div class="spin"></div></div>
    </div>
    <div id="tree-bar">
      <div id="crumbs" style="display:none"></div>
      <button id="fold-all" class="hdr-btn icon-btn" title="Collapse or expand everything"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="feather feather-chevrons-up"><polyline points="17 11 12 6 7 11"></polyline><polyline points="17 18 12 13 7 18"></polyline></svg></button>
    </div>
    <div id="tree"></div>
  </div>

  <div id="modal-back">
    <div id="modal">
      <h2 id="m-title">new goal</h2>
      <div id="m-parent" class="m-note"></div>
      <textarea id="m-summary" rows="3" placeholder="a state of the world: what's true when this is done?"></textarea>
      <div id="m-actions">
        <button id="m-cancel" class="hdr-btn">cancel</button>
        <button id="m-save" class="hdr-btn primary">create</button>
      </div>
    </div>
  </div>

  <div id="detail-back">
    <div id="detail">
      <div id="d-crumbs" class="m-note"></div>
      <textarea id="d-summary" rows="3"></textarea>
      <div id="d-toggles">
        <label class="d-flag"><input type="checkbox" id="d-actionable"> actionable</label>
        <label class="d-flag"><input type="checkbox" id="d-started"> started</label>
        <label class="d-flag"><input type="checkbox" id="d-done"> done</label>
      </div>
      <div id="d-deps"></div>
      <div id="d-actions">
        <button id="d-zoom" class="hdr-btn">zoom in</button>
        <button id="d-add" class="hdr-btn">+ subgoal</button>
        <button id="d-close" class="hdr-btn">close</button>
        <button id="d-save" class="hdr-btn primary">save</button>
      </div>
    </div>
  </div>
  <script src="/grubbery/goals/app.js"></script>
</body>
</html>
