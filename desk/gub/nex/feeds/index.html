<meta charset="utf-8">
<title>Feeds</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: monospace; max-width: 700px; margin: 40px auto; padding: 0 20px; background: #111; color: #ddd; }
  h1 { margin-bottom: 20px; color: #fff; }
  form { display: flex; gap: 8px; margin-bottom: 14px; }
  input { flex: 1; padding: 8px; background: #222; border: 1px solid #444; color: #ddd; font-family: monospace; }
  button { padding: 8px 16px; background: #333; border: 1px solid #555; color: #ddd; cursor: pointer; font-family: monospace; }
  button:hover { background: #444; }
  #sources { color: #888; margin-bottom: 24px; font-size: 0.9em; }
  #sources .src { margin: 2px 0; display: flex; gap: 8px; align-items: baseline; }
  #sources .src .del { cursor: pointer; color: #a55; }
  #sources .src .del:hover { color: #f66; }
  .item { padding: 10px 0; border-bottom: 1px solid #222; }
  .item a { color: #8cf; text-decoration: none; }
  .item a:hover { text-decoration: underline; }
  .item .meta { color: #666; font-size: 0.85em; margin-top: 2px; }
  .day { color: #999; margin: 18px 0 4px; border-bottom: 1px solid #333; }
  .error { color: #f66; margin: 10px 0; }
  .empty { color: #666; padding: 12px 0; }
</style>
<h1>Feeds</h1>
<form id="add-form">
  <input id="url-input" placeholder="https://example.com/rss.xml" required>
  <button type="submit">add</button>
  <button type="button" id="refresh-btn">refresh</button>
</form>
<div id="sources"></div>
<div id="items"></div>
<script src="/grubbery/feeds/feeds.js"></script>
